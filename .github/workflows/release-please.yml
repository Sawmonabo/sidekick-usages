name: Release Please

# Opens (and updates) a release PR that accumulates Conventional Commit
# messages from main since the last release. Merging that PR cuts the
# release: release-please tags `vX.Y.Z`, updates CHANGELOG.md, bumps the
# version in pyproject.toml, and creates the GitHub Release. The tag
# push then triggers publish.yml.
#
# The action authenticates with a fine-grained PAT (`RELEASE_PLEASE_TOKEN`)
# rather than the default `GITHUB_TOKEN`. This is deliberate: GitHub
# refuses to fire downstream workflows for events caused by GITHUB_TOKEN
# (anti-recursion guard), so a default-token tag push would NOT trigger
# publish.yml. A PAT push is attributed to a real user and does cascade.
#
# To rotate: create a new fine-grained PAT (Contents R/W + Pull requests
# R/W on this repo only), update the RELEASE_PLEASE_TOKEN secret, revoke
# the old PAT. PAT expiry is the silent-failure mode here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Open or merge release PR
    runs-on: ubuntu-latest
    steps:
    - uses: googleapis/release-please-action@v4
      id: release
      with:
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json
        token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

    # release-please bumps pyproject.toml and __init__.py but never uv.lock, so
    # the committed lockfile lags one version behind every release until some
    # `uv` command regenerates it locally -- which then surfaces as an annoying
    # uncommitted change. Regenerate and commit it here instead.
    #
    # Gated on `release_created` so the push below cannot loop: that push
    # re-triggers this workflow, but with no release cut the guard is false and
    # these steps are skipped. The PAT (not GITHUB_TOKEN) attributes the push to
    # a real user, matching how the release tag is pushed.
    - uses: actions/checkout@v6
      if: ${{ steps.release.outputs.release_created }}
      with:
        ref: main
        token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v8.1.0
      if: ${{ steps.release.outputs.release_created }}
    - name: Sync uv.lock to the released version
      if: ${{ steps.release.outputs.release_created }}
      run: |
        uv lock
        if git diff --quiet uv.lock; then
          echo "uv.lock already in sync with ${{ steps.release.outputs.tag_name }}"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add uv.lock
        git commit -m "chore(release): sync uv.lock for ${{ steps.release.outputs.tag_name }}"
        git push origin HEAD:main
