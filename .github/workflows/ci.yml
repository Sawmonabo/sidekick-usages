name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel in-flight runs on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit hooks (ruff + ty + bandit + ...)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        enable-cache: true
        cache-dependency-glob: '**/pyproject.toml'

    - name: Set up Python 3.14
      run: uv python install 3.14

    - name: Install all dependency groups
      run: uv sync --all-groups

    - name: Set up Node.js 22
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm

    - name: Validate documentation toolchain
      run: |
        npm ci
        npm audit --audit-level=moderate
        npm run lint:markdown

    - name: Cache pre-commit environments
      uses: actions/cache@v5
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # SKIP=no-commit-to-branch: that hook is meant for local commits;
      # CI runs on the merge ref and would always trip it.
    - name: Run pre-commit hooks
      env:
        SKIP: no-commit-to-branch
      run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (py3.14 on ${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          platform: linux-x64
        - os: macos-15
          platform: macos-arm64
        - os: macos-15-intel
          platform: macos-x64
        - os: windows-latest
          platform: windows-x64
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        enable-cache: true
        cache-dependency-glob: '**/pyproject.toml'

    - name: Set up Python 3.14
      run: uv python install 3.14

    - name: Install package + dev/test deps
      run: uv sync --all-groups

    - name: Verify exact wheel and dashboard release gates in isolation
      run: uv run python packaging/smoke_wheel.py --build

    - name: pytest with Unix pseudoterminal coverage
      if: runner.os != 'Windows'
      run: uv run pytest --cov=sidekick_usages --cov-report=xml

    - name: pytest with interactive mode disabled
      if: runner.os == 'Windows'
      run: >-
        uv run pytest
        --ignore=tests/dashboard/test_pty.py
        --cov=sidekick_usages
        --cov-report=xml

    - name: Upload coverage (Ubuntu only)
      if: matrix.platform == 'linux-x64'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-xml
        path: coverage.xml
        retention-days: 7

  homebrew-source:
    name: Homebrew source build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: pre-commit
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Homebrew
      uses: Homebrew/actions/setup-homebrew@24728b77430f9659b8d89068e4afe7f5fd0f973c
      with:
        setup-sandbox: ${{ runner.os == 'Linux' }}

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0

    - name: Set up Python 3.14
      run: uv python install 3.14

    - name: Archive the current checkout
      shell: bash
      run: >-
        git archive --format=tar.gz
        --prefix=sidekick-usages-source/
        --output=/tmp/sidekick-usages-source.tar.gz HEAD

    - name: Create ephemeral source-build tap
      run: brew tap-new --no-git sidekick-usages/ci

    - name: Generate current-source formula
      run: >-
        uv run packaging/homebrew/generate.py
        --source-archive /tmp/sidekick-usages-source.tar.gz
        --output
        "$(brew --repository sidekick-usages/ci)/Formula/sidekick-usages.rb"

    - name: Install from source
      run: >-
        brew install --build-from-source
        sidekick-usages/ci/sidekick-usages

    - name: Test installed formula
      run: brew test sidekick-usages/ci/sidekick-usages

  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    needs: [pre-commit, test, homebrew-source]
    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0

    - name: Set up Python 3.14
      run: uv python install 3.14

    - name: Build and verify exact distributions
      run: >-
        uv run python packaging/smoke_wheel.py
        --build --output-dir verified-dist

    - name: Upload distributions
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: verified-dist/
        retention-days: 14
